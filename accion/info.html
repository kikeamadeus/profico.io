<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profico - Soluciones Urbanas</title>

    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td,
        th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Asunto</th>
            <th>Mensaje</th>
        </tr>
        <tr>
            <td>Nombre</td>
            <td>Correo</td>
            <td>Teléfono</td>
            <td>Asunto</td>
            <td>Mensaje</td>
        </tr>
    </table>
</body>
</html>
